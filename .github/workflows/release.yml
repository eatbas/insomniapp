name: Release

on:
  # Attaches to the release matching the version in `tauri.conf.json`, so it can
  # verify the pipeline without cutting a new version. `RELEASE_CHEATSHEET.txt`
  # documents this path.
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: frontend/desktop/package-lock.json

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # master, Rust 1.99.1
        with:
          toolchain: 1.99.1

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: frontend/desktop/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: frontend/desktop
        run: npm ci

      - name: Build Tauri app (Windows NSIS x64)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend/desktop
          args: --bundles nsis
          tagName: v__VERSION__
          releaseName: 'insomniAPP v__VERSION__'
          releaseBody: 'See the assets below to download the installer for your platform.'
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true

  build-macos:
    # tauri-action builds latest.json by reading the copy already attached to the
    # release, adding its own platforms, and re-uploading. Run in parallel, both
    # jobs can read before either writes and the later upload drops the other's
    # platform. Serialising costs wall-clock time and buys a deterministic
    # manifest.
    needs: build-windows
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: frontend/desktop/package-lock.json

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # master, Rust 1.99.1
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: frontend/desktop/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: frontend/desktop
        run: npm ci

      - name: Build Tauri app (macOS universal DMG)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend/desktop
          # `app` is required, not optional: the macOS updater consumes
          # `.app.tar.gz`, which Tauri only emits from the `app` bundle. With
          # `dmg` alone the job produces no signature, tauri-action logs
          # "Signature not found for the updater JSON. Skipping upload...",
          # and latest.json ends up Windows-only — which is why macOS has
          # never been able to auto-update.
          args: --target universal-apple-darwin --bundles app,dmg
          tagName: v__VERSION__
          releaseName: 'insomniAPP v__VERSION__'
          releaseBody: 'See the assets below to download the installer for your platform.'
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
