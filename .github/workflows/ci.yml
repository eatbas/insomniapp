name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [web, desktop]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: frontend/${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        working-directory: frontend/${{ matrix.package }}
        run: npm ci

      - name: Type-check and build
        working-directory: frontend/${{ matrix.package }}
        run: npm run build

      - name: Test with the 100% coverage gate
        working-directory: frontend/${{ matrix.package }}
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.package }}
          path: frontend/${{ matrix.package }}/coverage
          if-no-files-found: error

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows and macOS jobs are what cover the platform-specific modules;
        # Linux covers the cross-platform code and the fallback shims.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `libxdo-dev` is one of Tauri v2's own documented Debian prerequisites,
      # not an enigo-only dependency, so it stays even though enigo is now a
      # macOS-only dependency.
      - name: Install Linux Tauri dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: frontend/desktop/package-lock.json

      # `tauri::generate_context!` reads `frontendDist` (../dist) at compile
      # time, so the bundle must exist before the crate will build.
      - name: Build the frontend bundle the Rust crate embeds
        working-directory: frontend/desktop
        run: |
          npm ci
          npm run build

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # master, Rust 1.99.1
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: frontend/desktop/src-tauri -> target

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Check formatting
        working-directory: frontend/desktop/src-tauri
        run: cargo fmt --check

      - name: Lint
        working-directory: frontend/desktop/src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      # `cargo coverage` is the alias in src-tauri/.cargo/config.toml; it pins
      # the documented adapter exclusions so CI and contributors measure the
      # same set of files.
      - name: Test with the 100% coverage gate
        working-directory: frontend/desktop/src-tauri
        run: cargo coverage --lcov --output-path lcov.info --fail-under-lines 100

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust-${{ matrix.os }}
          path: frontend/desktop/src-tauri/lcov.info
          if-no-files-found: error
