name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Vite 8 requires Node 20.19+ or 22.12+.
  NODE_VERSION: '22'

jobs:
  frontend:
    name: Frontend (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [web, desktop]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        working-directory: frontend/${{ matrix.package }}
        run: npm ci

      - name: Type-check and build
        working-directory: frontend/${{ matrix.package }}
        run: npm run build

      - name: Test with the 100% coverage gate
        working-directory: frontend/${{ matrix.package }}
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.package }}
          path: frontend/${{ matrix.package }}/coverage
          if-no-files-found: error

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows and macOS jobs are what cover the platform-specific modules;
        # Linux covers the cross-platform code and the fallback shims.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri and enigo dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/desktop/package-lock.json

      # `tauri::generate_context!` reads `frontendDist` (../dist) at compile
      # time, so the bundle must exist before the crate will build.
      - name: Build the frontend bundle the Rust crate embeds
        working-directory: frontend/desktop
        run: |
          npm ci
          npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/desktop/src-tauri -> target

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Check formatting
        working-directory: frontend/desktop/src-tauri
        run: cargo fmt --check

      - name: Lint
        working-directory: frontend/desktop/src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      # `cargo coverage` is the alias in src-tauri/.cargo/config.toml; it pins
      # the documented adapter exclusions so CI and contributors measure the
      # same set of files.
      - name: Test with the 100% coverage gate
        working-directory: frontend/desktop/src-tauri
        run: cargo coverage --lcov --output-path lcov.info --fail-under-lines 100

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-rust-${{ matrix.os }}
          path: frontend/desktop/src-tauri/lcov.info
          if-no-files-found: error
